name: Build VMGram APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Android SDK Components
        run: |
          echo "y" | sudo /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "ndk;21.4.707529" "cmake;3.22.1"

      - name: Add Missing Repositories
        run: |
          sed -i 's/jcenter()/mavenCentral()\n        maven { url "https:\/\/jitpack.io" }/g' build.gradle || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vmgam-debug-apk
          path: TMessagesProj/build/outputs/apk/debug/*.apk
